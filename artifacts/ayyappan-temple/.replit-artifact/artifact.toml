kind = "web"
previewPath = "/"
title = "அருள்மிகு ஸ்ரீ ஐயப்பன் திருக்கோவில்"
version = "1.0.0"
id = "artifacts/ayyappan-temple"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25427

[services.development]
run = "pnpm --filter @workspace/ayyappan-temple run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ayyappan-temple", "run", "build" ]
serve = "static"
publicDir = "artifacts/ayyappan-temple/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25427"
BASE_PATH = "/"

server {
    listen 80;
    server_name vadamadurai-ayyappan-temple.automystics.tech;

    # Redirect HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name vadamadurai-ayyappan-temple.automystics.tech;

    # SSL — update paths to your cert files
    ssl_certificate     /etc/letsencrypt/live/vadamadurai-ayyappan-temple.automystics.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vadamadurai-ayyappan-temple.automystics.tech/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /home/automystics-ayyappan/htdocs/vadamadurai-ayyappan-temple.automystics.tech;
    index index.html;

    # ── API — proxy to Node.js ──
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Static frontend (React SPA) ──
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Long-cache hashed assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
